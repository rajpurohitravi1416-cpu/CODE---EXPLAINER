<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code AI Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- 🔥 SIDEBAR -->
  <aside class="sidebar">
    <h2>⚡ Code AI</h2>

    <button onclick="setFeature('explain')">Explain</button>
    <button onclick="setFeature('line-explain')">Line Explainer</button>
    <button onclick="setFeature('convert')">Convert</button>
    <button onclick="setFeature('optimize')">Optimize</button>
    <button onclick="setFeature('compress')">Compress</button>
    <button onclick="setFeature('prompt')">Prompt → Code</button>
    <button onclick="setFeature('fill')">Half Code</button>
    <button onclick="setFeature('image')">Image → Code</button>
  </aside>

  <!-- 🔥 MAIN -->
  <main class="main">

    <!-- 🔥 TOPBAR -->
    <div class="topbar">
      <h2 id="title">Explain Code</h2>

      <div class="actions">
        <button class="btn secondary" onclick="copyOutput()">Copy</button>
        <button class="btn secondary" onclick="downloadCode()">Download</button>
        <button class="btn primary" onclick="run()">Run</button>
      </div>
    </div>

    <!-- 🔥 LANGUAGE SELECTORS -->
    <div id="langSelectors" class="lang-box" style="display:none;">

      <select id="fromLang">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="csharp">C#</option>
        <option value="go">Go</option>
        <option value="ruby">Ruby</option>
        <option value="php">PHP</option>
        <option value="typescript">TypeScript</option>
        <option value="swift">Swift</option>
        <option value="kotlin">Kotlin</option>
        <option value="rust">Rust</option>
        <option value="dart">Dart</option>
      </select>

      <button class="btn secondary" onclick="swapLang()">⇄</button>

      <select id="toLang">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="csharp">C#</option>
        <option value="go">Go</option>
        <option value="ruby">Ruby</option>
        <option value="php">PHP</option>
        <option value="typescript">TypeScript</option>
        <option value="swift">Swift</option>
        <option value="kotlin">Kotlin</option>
        <option value="rust">Rust</option>
        <option value="dart">Dart</option>
      </select>

    </div>

    <!-- 🔥 FILE INPUT -->
    <input type="file" id="fileInput" />

    <!-- 🔥 IMAGE OCR -->
    <input type="file" id="imageInput" style="display:none;" />

    <!-- 🔥 SPLIT SCREEN -->
    <div class="split">

      <!-- LEFT: CODE -->
      <div class="panel">
        <div class="panel-header">Code</div>
        <div id="editor" class="editor"></div>
      </div>

      <!-- RIGHT: OUTPUT -->
      <div class="panel">
        <div class="panel-header">Explanation</div>
        <pre id="output" class="output"></pre>
      </div>

    </div>

  </main>

</div>

<!-- 🔥 OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<!-- 🔥 MONACO -->
<script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>

<!-- 🔥 APP -->
<script src="app.js"></script>

</body>
</html>
